# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nena
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Demo mode: login codes are shown on screen (no SMS provider needed).
      - key: EXPOSE_OTP
        value: "1"
      # Mobile number(s) that get admin access, e.g. 09121234567
      - key: ADMIN_PHONES
        sync: false
